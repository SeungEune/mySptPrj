<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{cmm/layout/subLayout :: layout (contentLink=~{::contentLink}, script=~{::script}, content=~{::content})}">
<th:block th:fragment="contentLink">
    <link rel="stylesheet" th:href="@{/css/llm/chat.css}" />
</th:block>
<th:block th:fragment="script">
    <script th:inline="javascript">
        const AI_MODEL_NAME = /*[[${modelName}]]*/ 'llama3';
    </script>
    <script th:src="@{/js/llm/chatForm.js}"></script>
</th:block>
<div th:fragment="content" class="wrap-inner">
    <section class="sub-title">
        <h2 class="txt-head-md">AI 채팅</h2>
    </section>

    <section class="sub-contents">
        <div class="conts-wrap ai-chat-wrap">
            <div class="ai-chat-header">
                <div>
                    <p class="ai-chat-title">로컬 LLM 테스트</p>
                    <p class="ai-chat-desc">질문을 입력하면 로컬 LLM 응답을 확인할 수 있습니다.</p>
                </div>
                <div class="ai-chat-status">
                    <span class="status-label">모델</span>
                    <strong id="modelName" th:text="${modelName}">llama3</strong>
                </div>
            </div>

            <div class="conts-wrap">
                <div class="search-form llm-search-form">
                    <div class="select-group">
                        <div class="select-box llm-role-select-box">
                            <select id="promptRoleCd" class="select"></select>
                        </div>
                    </div>
                    <div class="input-box llm-role-desc-box">
                        <input type="text" id="promptRoleDesc" class="input" readonly value="역할 설명이 표시됩니다.">
                    </div>
                    <div class="button-group">
                        <button type="button" class="primary-button" id="newChatBtn"><span>새 대화 시작</span></button>
                        <button type="button" class="tertiary-button" id="resetBtn"><span>초기화</span></button>
                    </div>
                </div>
            </div>

            <div class="conts-wrap llm-split-wrap">
                <div class="llm-session-panel table-box">
                    <div class="item-horizontal-box jst-btw align-ct mb-10">
                        <div class="total-count">
                            <span class="txt-body-sm">대화 목록</span>
                        </div>
                    </div>
                    <div class="llm-session-list" id="sessionListArea">
                        <div class="llm-session-empty">저장된 대화가 없습니다.</div>
                    </div>
                </div>

                <div class="llm-chat-panel table-box">
                    <div class="item-horizontal-box jst-btw align-ct mb-10">
                        <div class="total-count">
                            <span class="txt-body-sm" id="chatSessionInfo">선택된 대화가 없습니다. 새 대화를 시작하거나 기존 대화를 선택하세요.</span>
                        </div>
                    </div>

                    <div class="ai-chat-body" id="chatMessageArea">
                        <div class="ai-message empty-message" id="emptyMessage">
                            <div class="message-bubble">
                                대화를 시작해보세요.
                            </div>
                        </div>
                    </div>

                    <div class="ai-chat-input-area">
                        <textarea id="chatInput" class="input ai-chat-textarea" placeholder="질문을 입력하세요." maxlength="10000"></textarea>
                        <div class="ai-chat-input-meta">
                            <span id="chatInputLength" class="ai-chat-input-length">0 / 10000자</span>
                        </div>
                        <div class="button-group ai-chat-button-group">
                            <button type="button" class="primary-button" id="sendBtn"><span>전송</span></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="llm-perf-wrap">
                <div class="perf-title-wrap">
                    <h3 class="txt-head-sm">동시 요청 성능 테스트</h3>
                    <p class="perf-desc">동시 요청 수와 총 요청 수를 입력해 성능을 비교하고, 결과를 표로 확인할 수 있습니다.</p>
                </div>
                <div class="perf-form-grid">
                    <div class="input-box">
                        <label for="perfPrompt" class="perf-label">테스트 프롬프트</label>
                        <textarea id="perfPrompt" class="input ai-chat-textarea perf-textarea" placeholder="성능 테스트에 사용할 프롬프트를 입력하세요."></textarea>
                    </div>
                    <div class="perf-inline-fields">
                        <div class="input-box">
                            <label for="perfConcurrency" class="perf-label">동시 요청 수</label>
                            <input type="number" id="perfConcurrency" class="input" value="1" min="1" max="20">
                        </div>
                        <div class="input-box">
                            <label for="perfRequestCount" class="perf-label">총 요청 수</label>
                            <input type="number" id="perfRequestCount" class="input" value="3" min="1" max="100">
                        </div>
                    </div>
                </div>
                <div class="button-group ai-chat-button-group">
                    <button type="button" class="primary-button" id="runPerfTestBtn"><span>성능 테스트 실행</span></button>
                </div>
                <div class="perf-summary" id="perfSummaryArea">
                    아직 성능 테스트 결과가 없습니다.
                </div>
                <div class="table-inner perf-table-wrap">
                    <table class="table-type01">
                        <caption class="sr-only">성능 테스트 결과</caption>
                        <colgroup>
                            <col width="12%"/>
                            <col width="18%"/>
                            <col width="18%"/>
                            <col width="18%"/>
                            <col/>
                        </colgroup>
                        <thead>
                        <tr>
                            <th class="tc">요청번호</th>
                            <th class="tc">상태</th>
                            <th class="tc">응답시간(ms)</th>
                            <th class="tc">응답길이</th>
                            <th class="tc">오류메시지</th>
                        </tr>
                        </thead>
                        <tbody id="perfResultBody">
                        <tr>
                            <td class="no-data-table" colspan="5">조회 결과가 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script type="text/x-jquery-tmpl" id="perfEmptyTemplate">
    <tr>
        <td class="no-data-table" colspan="5">조회 결과가 없습니다.</td>
    </tr>
    </script>

    <script type="text/x-jquery-tmpl" id="perfResultTemplate">
    <tr>
        <td class="tc">{{html requestNo}}</td>
        <td class="tc">{{html status}}</td>
        <td class="tc">{{html elapsedMs}}</td>
        <td class="tc">{{html responseLength}}</td>
        <td class="tl">{{html errorMessage}}</td>
    </tr>
    </script>

    <script type="text/x-jquery-tmpl" id="sessionListTemplate">
    <button type="button" class="llm-session-item {{if isActive}}active{{/if}}" onclick="fn_selectSession('{{html chatSessionId}}')">
        <strong class="session-title">{{html sessionTitle}}</strong>
        <span class="session-meta">{{html promptRoleCd}} · {{html lastUpdtDt}}</span>
    </button>
    </script>
</div>
</html>
