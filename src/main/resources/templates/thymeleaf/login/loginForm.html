<!DOCTYPE html>
<html th:replace="~{cmm/layout/loginLayout :: layout(~{::content}, '로그인')}"
      xmlns:th="http://www.thymeleaf.org">
<body th:fragment="content">
    <div class="login-container">
        <div class="login-box">
            <div class="logo-area">
                <img src="/images/logo.png" alt="Spatialt 로고">
            </div>
            
            <!-- 에러 메시지 표시 -->
            <div th:if="${loginError}" class="error-message" th:text="${loginError}"></div>
            
            <form th:action="@{/login/actionLogin.do}" method="post">
                <div class="form-group">
                    <label for="userId">아이디</label>
                    <input type="text" id="userId" name="userId" placeholder="아이디를 입력하세요" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                </div>
                
                <button type="submit" class="login-btn">로그인</button>
            </form>

            <div class="login-footer">
                <p class="copyright">Copyright © Spatialt Co., Ltd. All Rights Reserved.</p>
            </div>
        </div>
    </div>
</body>
</html>
