<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!-- 사용자 검색 모달 Fragment -->
<div th:fragment="userSearchModal" id="userSearchModal" class="user-modal spt-modal lg">
    <div class="spt-modal-overlay" onclick="UserSearchModal.close()"></div>
    <div class="spt-modal-container">
        <div class="spt-modal-header">
            <h3 class="txt-head-sm">사용자 검색</h3>
            <button type="button" class="user-modal-close spt-modal-close" onclick="UserSearchModal.close()">&times;</button>
        </div>
        <div class="spt-modal-body">
            <!-- 검색 영역 -->
            <div class="modal-search-area">
                <div class="select-box w150px">
                    <select id="modalUserSearchType" class="select">
                        <option value="userNm">사용자명</option>
                        <option value="userId">사용자ID</option>
                    </select>
                </div>
                <input type="text" id="modalUserSearchKeyword" class="input" placeholder="검색어를 입력하세요"
                       onkeypress="if(event.key==='Enter') UserSearchModal.searchUserList(1);">
                <button type="button" class="primary-button" onclick="UserSearchModal.searchUserList(1);">검색</button>
            </div>
            <!-- 사용자 목록 테이블 -->
            <div class="user-modal-table-container">
                <div class="table-box">
                    <div class="table-inner">
                        <table class="table-type01 select-table">
                            <colgroup>
                                <col width="5%"/>
                                <col width="25%"/>
                                <col width="20%"/>
                                <col width="25%"/>
                                <col width="25%"/>
                            </colgroup>
                            <thead>
                            <tr>
                                <th>
                                    <input type="checkbox" id="modalUserSelectAll" onclick="UserSearchModal.toggleSelectAll(this.checked);">
                                </th>
                                <th>사용자명</th>
                                <th>사용자ID</th>
                                <th>부서명</th>
                                <th>상태</th>
                            </tr>
                            </thead>
                            <tbody id="modalUserListTbody">
                            <tr>
                                <td class="tc no-data-table" colspan="5">검색어를 입력하여 사용자를 조회하세요</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- 페이징 영역 -->
                    <div id="modalUserPaginationArea"></div>
                </div>
            </div>
            <!-- 버튼 영역 -->
            <div class="spt-modal-footer">
                <button type="button" class="primary-button" onclick="UserSearchModal.confirmSelection();">확인</button>
                <button type="button" class="secondary-button" onclick="UserSearchModal.close();">취소</button>
            </div>
        </div>
    </div>
</div>

</html>
