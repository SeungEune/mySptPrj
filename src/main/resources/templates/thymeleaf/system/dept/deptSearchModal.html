<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

  <!-- 부서 검색 모달 Fragment -->
  <div th:fragment="deptSearchModal" id="deptSearchModal" class="dept-modal spt-modal">
    <div class="dept-modal-overlay spt-modal-overlay" onclick="DeptSearchModal.close()"></div>
    <div class="dept-modal-container spt-modal-container">
      <div class="dept-modal-header spt-modal-header">
        <h3 class="txt-head-sm">부서 검색</h3>
        <button type="button" class="dept-modal-close spt-modal-close" onclick="DeptSearchModal.close()">&times;</button>
      </div>
      <div class="dept-modal-body spt-modal-body">
        <!-- 검색 영역 -->
        <div class="modal-search-area">
          <input type="text"
                 id="modalDeptNm"
                 class="input"
                 placeholder="부서명을 입력하세요"
                 onkeypress="if(event.key==='Enter') DeptSearchModal.searchDeptList();">
          <button type="button" class="primary-button" onclick="DeptSearchModal.searchDeptList();">검색</button>
        </div>

        <!-- 트리 컨테이너 -->
        <div class="spt-tree-container">
          <!-- 검색 결과 정보 -->
          <div class="spt-search-result-info">
            <span id="modalDeptTotalCount">전체 0개</span>
          </div>

          <!-- 트리 리스트 -->
          <div class="spt-tree-list" id="modalDeptTreeList">
            <div class="spt-tree-loading">부서 정보를 불러오는 중...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</html>
